<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // 1. Save the path the user was trying to access (e.g., "/technology")
    sessionStorage.setItem('redirectPath', window.location.pathname);
    // 2. Redirect them to the main index.html
    window.location.replace('/'); 
  </script>
</head>
<body>
</body>
</html>
